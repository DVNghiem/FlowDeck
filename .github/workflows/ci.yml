name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  scan:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate docs
        run: node scripts/validate-docs.mjs

      - name: Test
        run: npm run test

      - name: Validate Claude Code plugin
        run: npx --yes --package=@anthropic-ai/claude-code@2.1.322 claude plugin validate integrations/claude-code --strict

  fdx-macos:
    name: FDX macOS (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report architecture
        run: uname -m
      - name: Build FDX
        run: cargo build --locked --manifest-path crates/fdx/Cargo.toml
      - name: Smoke test FDX
        run: cargo run --locked --manifest-path crates/fdx/Cargo.toml -- --version
